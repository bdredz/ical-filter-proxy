# Gwinnett County Public Schools: school-specific events only.
# Allowlist: an event is kept only if its SUMMARY matches one of these patterns.
# General holidays (Labor Day, MLK, Memorial Day, Christmas Day...), board meetings,
# observances and awareness months are dropped; school breaks are kept.
gwinnett-school:
  name: Gwinnett School Calendar 2026-27
  ical_url: https://www.gcpsk12.org/fs/calendar-manager/events.ics?calendar_ids=1
  timezone: America/New_York
  rules:
    - field: summary
      operator: matches
      val:
        - '/^\s*(First|Last) Day (of|for) (School|Students)/i'
        - '/^\s*Early Release/i'
        - '/^\s*Digital Learning Day/i'
        - '/\b(1st|2nd|First|Second) Semester\b/i'
        - '/Pre-?planning|Post-?planning|Teacher Planning|Staff Development/i'
        - '/\(School Holidays?\)/i'
        - '/^\s*Spring Break/i'
        - '/^\s*100th Day of School/i'
  # Dates on the official 2026-27 GCPS calendar PDF that the district feed omits.
  extra_events:
    - summary: Teacher Planning/Staff Development (Student Holiday)
      date: '2027-01-04'
      description: 'No school for students. Source: GCPS 2026-27 school year calendar.'
